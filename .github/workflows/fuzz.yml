# Nightly fuzzing: thousands of mutated PDFs and images through every operation, with a fresh
# random seed each night. Any error that is not a typed PdfToolsError fails the run, and the
# crashing inputs plus a report (seed, op, mutations) are uploaded for reproduction:
#   FUZZ_SEED=<seed> FUZZ_ONLY=<op> pnpm fuzz
name: Nightly fuzz

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      iterations:
        description: Iterations (each runs every op once)
        default: '3000'

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm fuzz
        env:
          FUZZ_ITERATIONS: ${{ inputs.iterations || '3000' }}
          FUZZ_SEED: random
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crashes-${{ github.run_id }}
          path: packages/core/fuzz/crashes
          retention-days: 30
