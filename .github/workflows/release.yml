# On a signed version tag: build once, publish SHA256SUMS and SLSA build provenance, deploy that
# exact artifact. Deploy runs only from tags on this repository (never forks) with secrets set.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          VITE_SITE_URL: ${{ vars.SITE_URL }}
      - name: Package and hash
        run: |
          cd apps/web/dist
          find . -type f ! -name '*.map' -print0 | sort -z | xargs -0 sha256sum > ../../../SHA256SUMS
          tar --sort=name --mtime='2024-01-01' -czf ../../../pdf-tools-site.tar.gz .
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: pdf-tools-site.tar.gz
      - name: GitHub release with hashes
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" pdf-tools-site.tar.gz SHA256SUMS --verify-tag --generate-notes
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: apps/web/dist

  deploy:
    needs: build
    if: github.repository_owner == vars.DEPLOY_OWNER && vars.DEPLOY_OWNER != ''
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: dist
      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ vars.PAGES_PROJECT }} --branch=main
