# Release: on a version tag, build once, refuse to ship placeholders, publish SHA256SUMS and
# SLSA build provenance on a GitHub release, then deploy that exact artifact to Cloudflare Pages.
# The deploy job runs only in the owner's repository, only when the Cloudflare secrets exist,
# and only through the protected `production` environment (required reviewers).
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # Required reviewers on this environment gate every release build (docs/LAUNCH.md), so a
    # pushed tag alone cannot produce a signed provenance statement.
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      SITE_URL: ${{ vars.SITE_URL }}
      SITE_CF_ANALYTICS_TOKEN: ${{ vars.SITE_CF_ANALYTICS_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Only release commits that are on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "Tag is not on main"; exit 1; }
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Refuse to release with placeholder name, URL or contacts
        run: pnpm check:launch
      - run: pnpm build
      - name: Package and hash
        run: |
          cd apps/web/dist
          find . -type f ! -name '*.map' -print0 | sort -z | xargs -0 sha256sum > ../../../SHA256SUMS
          tar --sort=name --mtime='2024-01-01' --owner=0 --group=0 --numeric-owner -czf ../../../paperhold-site.tar.gz .
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            paperhold-site.tar.gz
            SHA256SUMS
      - name: GitHub release with hashes
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" pdf-tools-site.tar.gz SHA256SUMS --verify-tag --generate-notes
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: apps/web/dist
          retention-days: 30

  deploy:
    needs: build
    if: vars.DEPLOY_OWNER != '' && github.repository_owner == vars.DEPLOY_OWNER
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - name: Check deploy secrets are configured
        id: secrets
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$ACCOUNT" ]; then
            echo "Cloudflare secrets are not set; skipping deploy (see docs/LAUNCH.md)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.secrets.outputs.ready == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: dist
      - if: steps.secrets.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ vars.PAGES_PROJECT }} --branch=main --commit-dirty=true
