# docker compose up  ->  http://localhost:8080
services:
  web:
    build:
      context: .
      args:
        SITE_URL: ${SITE_URL:-}
        SITE_CF_ANALYTICS_TOKEN: ${SITE_CF_ANALYTICS_TOKEN:-}
    ports:
      - '8080:8080'
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
